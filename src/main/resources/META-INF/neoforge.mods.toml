# NeoForge 1.21.x loads mixin configs from this declaration (the MixinConfigs
# manifest attribute is kept as well for compatibility).
[[mixins]]
config="mixins.goetyfix.json"

[[mods]]
modId="goetyfix"
version="2.0.0"
displayName="诡厄巫法召唤物崩溃补丁 (1.21.1 / NeoForge)"
logoFile="goetyownedfix-icon.png"
description="Fixes the 'Ticking entity' NullPointerException family in Goety's isAlliedTo overrides on Minecraft 1.21.1 / NeoForge. HurtByTargetGoal.alertOthers passes a null entity (cleared or absent getLastHurtByMob) into isAlliedTo; Entity.isAlliedTo(Entity) dereferences the argument with no null check, and Goety 3.1.5.1's 19 overriding classes either dereference it directly or forward it to the unguarded vanilla method. This patch null-guards every Goety 3.1.5.1 override plus the vanilla Entity.isAlliedTo safety net plus MobUtil.illagerAllies: a null argument returns false (a null entity can never be an ally), all other calls pass through unchanged with zero side effects. Mixin-only, contains no Goety code. Soft mode: if a future update removes a target class, the mixin is skipped with a warning instead of crashing the game."
authors="LLXJ"

