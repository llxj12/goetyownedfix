[[mods]]
modId="goetyfix"
version="1.1.0"
displayName="诡厄巫法召唤物崩溃补丁"
description="Fixes the 'Ticking entity' NullPointerException family in Goety's isAlliedTo overrides (SRG m_7307_). HurtByTargetGoal.alertOthers passes a null entity (cleared/absent getLastHurtByMob) into isAlliedTo; vanilla 1.20.1 Entity.isAlliedTo dereferences the argument (p.getTeam()) with no null check, and Goety's 19 overriding classes (Apostle.java:399, Owned, Vizier, BoneLord, SkullLord, Cultist, ...) either dereference it directly or forward it to the unguarded vanilla method. v1.1 null-guards every Goety override plus the vanilla Entity.isAlliedTo entry point as a safety net: a null argument returns false (a null entity can never be an ally), all other calls pass through unchanged with zero side effects. Mixin-only, contains no Goety code."
authors="LLXJ"

