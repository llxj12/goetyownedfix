[[mods]]
modId="goetyfix"
version="1.0.0"
displayName="诡厄巫法召唤物崩溃补丁"
description="Fixes the recurring 'Ticking entity' NullPointerException in Goety's Owned.isAlliedTo (Owned.java:186): HurtByTargetGoal.alertOthers passes a null entity (cleared getLastHurtByMob) to Owned summons (Inferno, ZombieServant, ...), which forwards it to vanilla Entity.isAlliedTo where p.getTeam() is called without a null check. The mixin returns false for a null argument, which is safe and has no side effects."
authors="LLXJ"

