[[mods]]
modId="goetyownedfix"
version="1.2.1"
displayName="诡厄巫法召唤物崩溃补丁"
description="Fixes two 'Ticking entity' NullPointerException families in Goety. (1) isAlliedTo (SRG m_7307_): HurtByTargetGoal.alertOthers passes a null entity (cleared/absent getLastHurtByMob) into isAlliedTo; vanilla 1.20.1 Entity.isAlliedTo dereferences the argument (p.getTeam()) with no null check, and Goety's 19 overriding classes (Apostle.java:399, Owned, Vizier, BoneLord, SkullLord, Cultist, ...) either dereference it directly or forward it to the unguarded vanilla method. All 19 overrides, the vanilla Entity.isAlliedTo safety net, MobUtil.illagerAllies and RevelationFix's HereticServant / MaverickServant / ApostleServant callers are guarded: a null argument returns false (a null entity can never be an ally), all other calls pass through unchanged with zero side effects. (2) HellBlast (v1.2.0): an OWNERLESS HellBlast (Lavaball / Meteor Shower spells, or /summon goety:hell_blast) captures a null owner in its anonymous SpellExplosion subclass, and explodeHurt() sets that owner on fire while the explosion damages something (HellBlast.java:177) -> NPE. The mixin redirects that single Entity.setRemainingFireTicks call inside HellBlast$1.explodeHurt and skips it when the owner is null; the guard must sit on that call site because the NPE is thrown from SpellExplosion's constructor (SpellExplosion.java:72 calls explodeHurt), where an @At(\"RETURN\") injector can never run. Explosion damage and every owned-HellBlast path are untouched. Optional add-ons are guarded too, via string-target mixins that add no compile-time dependency: goety_supreme IfritClone and goetyominous MurmurServant / MurmurServantHead. Mixin-only, contains no Goety or RevelationFix code. Soft mode: if a future update removes a target class/call site, the affected mixin is skipped with a warning instead of crashing the game."
authors="LLXJ"

